[loggers]
keys=root,video_processor

[handlers]
keys=consoleHandler

[formatters]
keys=standardFormatter

[logger_root]
level=WARNING
handlers=consoleHandler

[logger_video_processor]
level=INFO
handlers=consoleHandler
qualname=multimodal_stream.video_processor
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=standardFormatter
args=(sys.stdout,)

[formatter_standardFormatter]
format=%(levelname)s:%(name)s:%(message)s
