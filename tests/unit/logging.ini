[loggers]
keys=root,multimodal_stream

[handlers]
keys=consoleHandler

[formatters]
keys=standardFormatter

[logger_root]
level=WARNING
handlers=consoleHandler

[logger_multimodal_stream]
level=INFO
handlers=consoleHandler
qualname=multimodal_stream
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=standardFormatter
args=(sys.stdout,)

[formatter_standardFormatter]
format=%(levelname)s:%(name)s:%(message)s
